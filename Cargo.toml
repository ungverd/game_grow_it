[package]
authors = ["The wasm-bindgen Developers"]
edition = "2021"
name = "without-a-bundler"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2.108"
js-sys = "0.3.85"
rand = "0.10.1"

[dependencies.web-sys]
features = [
  'Document',
  'Element',
  'HtmlCanvasElement',
  'HtmlImageElement',
  'WebGlBuffer',
  'WebGlFramebuffer',
  'WebGlVertexArrayObject',
  'WebGl2RenderingContext',
  'WebGlProgram',
  'WebGlShader',
  'WebGlTexture',
  'WebGlUniformLocation',
  'Window',
]
version = "0.3.85"
