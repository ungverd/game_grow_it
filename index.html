<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
    <script>
    	
    	function getPos(e){
        canvas = document.getElementById("canvas");
        var rect = canvas.getBoundingClientRect();
    		x = e.clientX - rect.left;
    		y = 600 + rect.top - e.clientY;
    		cursor="Your Mouse Position Is : " + x + " and " + y ;
    		document.getElementById("displayArea").innerHTML=cursor
    	}
    
    	function stopTracking(){
    		document.getElementById("displayArea").innerHTML="";
    	}
    
    	</script>
      <style>
        .triangleUp {
          width: 30px;
          aspect-ratio: 1/cos(30deg);
          clip-path: polygon(50% 0,100% 100%,0 100%);
          background: linear-gradient(45deg,#5b7a41,#26ac48);
        }
        .triangleDown {
          width: 30px;
          aspect-ratio: 1/cos(30deg);
          clip-path: polygon(0 0,100% 0,50% 100%);
          background: linear-gradient(45deg,#5b7a41,#26ac48);
        }
        .blockOfBlocks {
          display: inline-block;
        }
        .number {
          display: flex;
          justify-content: center;
        }
        .atCenter {
          display: flex;
          justify-content: center;
          align-items: center;
        }
        .button {
          display: block;
        }
        .globalBlock {
          width: 600;
        }
    </style>
  </head>
  <body>
    <canvas id="canvas" height="600" width="600" onmousemove="getPos(event)" onmouseout="stopTracking()"></canvas>
    <div class="globalBlock">
      <div class="atCenter">
        <div class="blockOfBlocks">
          <div class="triangleUp" id="upLeft"></div>
          <div class="number" id="left">0</div>
          <div class="triangleDown" id="downLeft"></div>
        </div>
        <div class="blockOfBlocks">
          <div class="triangleUp" id="upRight"></div>
          <div class="number" id="right">0</div>
          <div class="triangleDown" id="downRight"></div>
        </div>
      </div>
      <div class="atCenter">
        <div  class="blockOfBlocks">
          <button id="growButton" class="button"> Grow! </button>
          <button id="undoButton" class="button"> Undo </button>
        </div>
      </div>
    </div>
    <p id="displayArea"></p>
    <script type="module">
      import init, { GameState } from './web/pkg/without_a_bundler.js';

      async function run() {
        await init();
        let gamestate = GameState.new();
        const response_leaf = await fetch('./leaf6_blurred_square.json');
        const json_leaf = await response_leaf.json();
        const fname_leaf = json_leaf.fname;
        var image_leaf = new Image();
        image_leaf.src = `./${fname_leaf}`;
        image_leaf.onload = async function() {
          const response_monkey = await fetch('./monkey_anim_L.json');
          const json_monkey = await response_monkey.json();
          const fname_monkey = json_monkey.fname;
          var image_monkey = new Image();
          image_monkey.src = `./${fname_monkey}`;
          image_monkey.onload = function () {
            gamestate.do_shader_stuff_and_constants(image_leaf,
                                                    image_monkey,
                                                    json_leaf.xmax_ratio,
                                                    json_leaf.ymax_ratio,
                                                    json_leaf.trunk_ratio,
                                                    json_leaf.x_circle,
                                                    json_leaf.y_circle,
                                                    json_leaf.radius,
                                                    json_leaf.theta_max,
                                                    json_leaf.theta_min,
                                                    json_monkey.width,
                                                    json_monkey.height,
                                                    json_monkey.frame_width,
                                                    json_monkey.frame_height,
                                                    json_monkey.n_frames,
                                                    json_monkey.time_loop,
                                                    json_monkey.advance_loop);
            let left = document.getElementById("left");
            let right = document.getElementById("right");
            function onUpLeft(e) {
              left.innerHTML = gamestate.left_plus();
            }
            document.getElementById("upLeft").onclick = onUpLeft;

            function onUpRight(e) {
              right.innerHTML = gamestate.right_plus();
            }
            document.getElementById("upRight").onclick = onUpRight;

            function onDownLeft(e) {
              left.innerHTML = gamestate.left_minus();
            }
            document.getElementById("downLeft").onclick = onDownLeft;

            function onDownRight(e) {
              right.innerHTML = gamestate.right_minus();
            }
            document.getElementById("downRight").onclick = onDownRight;

            function onGrow(e) {
              gamestate.grow_tree();
            }
            document.getElementById("growButton").onclick = onGrow;

            function onUndo(e) {
              gamestate.undo_grow_tree();
            }
            document.getElementById("undoButton").onclick = onUndo;

            let canvas = document.getElementById("canvas");
            function onCanvasClick(e) {
              var rect = canvas.getBoundingClientRect();
    		      x = e.clientX - rect.left;
              gamestate.onclick(x);
            }
            canvas.onclick = onCanvasClick;

            let prev;
            let next;
            function step(timestamp) {
              if (prev === undefined) {
                prev = timestamp;
              }
              next = timestamp;
              const elapsed = next - prev;
              gamestate.on_animation_frame(elapsed / 1000);
              prev = timestamp;
              requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
          }
        }
      }

      run();
    </script>
  </body>
</html>
