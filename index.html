<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
  </head>
  <body>
    <canvas id="canvas" height="600" width="600"></canvas>
    <script type="module">
      import init, { render } from './web/pkg/without_a_bundler.js';

      async function run() {
        await init();
        const response = await fetch('./leaf2_rotated_square.json');
        const json = await response.json();
        const fname = json.fname;
        var image = new Image();
        image.src = `./${fname}`;
        image.onload = function() {
          render(image, json.xmax_ratio, json.ymax_ratio, json.trunk_ratio);
        }
      }

      run();
    </script>
  </body>
</html>
